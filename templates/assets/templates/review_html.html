<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - FireSpot 审核稿</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }
        .wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 64px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            padding: 28px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 32px;
            line-height: 1.25;
            margin: 0 0 16px;
        }
        p, li {
            font-size: 16px;
            line-height: 1.8;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        ul {
            padding-left: 20px;
        }
        .meta {
            color: #475569;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 13px;
            margin-right: 8px;
        }
        .content p {
            margin: 16px 0;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="meta">
                <span class="badge">FireSpot Stage 6</span>
                待审核 HTML
            </div>
            <h1>{{title}}</h1>
            <ul>
                <li><strong>合规评分：</strong>{{score}}</li>
                <li><strong>正文字数：</strong>{{word_count}}</li>
                <li><strong>问题数：</strong>{{issue_count}}</li>
                <li><strong>警告数：</strong>{{warning_count}}</li>
                <li><strong>图片资产数：</strong>{{asset_count}}</li>
                <li><strong>校验状态：</strong>{{validation_status}}</li>
            </ul>
        </div>
        <div class="card content">
            {{html_body}}
        </div>
    </div>
</body>
</html>
